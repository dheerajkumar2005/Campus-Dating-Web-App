<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <h1>Registration</h1>
    <form action="/register" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br>
        <label for="rollNumber">IITB Roll Number:</label>
        <input type="text" id="rollNumber" name="rollNumber" required><br>
        <label for="year">Year of Study:</label>
        <input type="number" id="year" name="year" min="1" max="4" required><br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="18" max="99" required><br>
        <label for="interests">Interests (comma-separated):</label>
        <input type="text" id="interests" name="interests" required><br>
        <label for="gender">Gender:</label>
        <input type="text" id="gender" name="gender" required><br>
        <label for="hobbies">Hobbies (comma-separated):</label>
        <input type="text" id="hobbies" name="hobbies" required><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br>
        <button type="submit">Register</button>
    </form>
</body>
</html>
