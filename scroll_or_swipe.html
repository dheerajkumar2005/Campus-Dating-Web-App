<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll_or_swipe</title>
</head>
<body id="main">
    <script>
        let profiles;
        fetch('students.json')
			.then(response => response.json())
			.then(data => {
				// Parse the response into a JavaScript object
				profiles = data;
                console.log(profiles);
                for (let i=0;i<profiles.length; i++){
                // console.log(i)
                    const div = document.createElement('div');
                    div.setAttribute('id', `profile-${i}`);

                    div.innerHTML = `<h3>${profiles[i].Name}</h3>
                                     <p>Roll Number: ${profiles[i]["IITB Roll Number"]}</p>
                                     <p>Year of Study: ${profiles[i]["Year of Study"]} </p>
                                     <p>Age: ${profiles[i].Age}</p>
                                     <p>Gender: ${profiles[i].Gender}</p>
                                     <img src=${profiles[i].Photo} width="100" height="100">
                                     <p>Interests: ${profiles[i].Interests}</p>
                                     <p>Hobbies: ${profiles[i].Hobbies}</p>`
                    
                    div.style.border = "1px solid black";
                    div.style.paddingLeft="10px"
                    document.getElementById("main").appendChild(div);

                }
			})
			.catch(error => console.error('Error fetching JSON data:', error));
        
        
    </script>
</body>
</html>
